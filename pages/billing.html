<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Billing</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/patient.css">

</head>

<body>

    <div class="container">

        <h1>Patient Billing</h1>

        <div class="search-box">

            <input type="text" id="patientId" placeholder="Enter Patient ID">

            <button id="searchBtn">

                Search

            </button>

        </div>

        <form id="billForm" style="display:none;">

            <div class="grid">

                <div class="input-group">

                    <label>Patient Name</label>

                    <input type="text" id="patientName" readonly>

                </div>

                <div class="input-group">

                    <label>Room Type</label>

                    <input type="text" id="roomType" readonly>

                </div>

                <div class="input-group">

                    <label>Days Stayed</label>

                    <input type="number" id="days" min="1" value="1">

                </div>

                <div class="input-group">

                    <label>Medicine Bill</label>

                    <input type="number" id="medicine" value="0">

                </div>

                <div class="input-group">

                    <label>Diagnostics Bill</label>

                    <input type="number" id="diagnostics" value="0">

                </div>

                <div class="input-group">

                    <label>Room Bill</label>

                    <input type="number" id="roomBill" readonly>

                </div>

                <div class="input-group">

                    <label>Total Bill</label>

                    <input type="number" id="totalBill" readonly>

                </div>

            </div>

            <div class="buttons">

                <button type="button" id="calculateBtn">

                    Calculate

                </button>

                <button type="button" id="printBtn">

                    Print Bill

                </button>

                <button type="button" id="updateBillBtn">

                    Update Bill

                </button>

            </div>

        </form>

    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/billing.js"></script>

</body>

</html>
