<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Portal</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/userDashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <i class="fa-solid fa-hospital"></i>

            <h2>Patient Portal</h2>

        </div>

        <button id="profileBtn" class="active">

            <i class="fa-solid fa-user"></i>

            My Profile

        </button>

        <button id="billingBtn">

            <i class="fa-solid fa-file-invoice-dollar"></i>

            My Billing

        </button>

        <button id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </aside>

    <!-- Main Content -->

    <main class="content">

        <!-- ================= PROFILE ================= -->

        <section id="profileSection">

            <h1>My Profile</h1>

            <form id="patientForm">

                <div class="grid">

                    <div class="input-group">
                        <label>Patient ID</label>
                        <input type="text" id="patientId" readonly>
                    </div>

                    <div class="input-group">
                        <label>First Name</label>
                        <input type="text" id="firstName">
                    </div>

                    <div class="input-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName">
                    </div>

                    <div class="input-group">
                        <label>Age</label>
                        <input type="number" id="age">
                    </div>

                    <div class="input-group">
                        <label>Gender</label>

                        <select id="gender">

                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>

                        </select>

                    </div>

                    <div class="input-group">
                        <label>Date of Birth</label>
                        <input type="date" id="dob">
                    </div>

                    <div class="input-group">
                        <label>Blood Group</label>

                        <select id="bloodGroup">

                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>

                        </select>

                    </div>

                    <div class="input-group">
                        <label>Phone</label>
                        <input type="text" id="phone">
                    </div>

                    <div class="input-group full">
                        <label>Address</label>
                        <textarea id="address"></textarea>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email">
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password">
                    </div>

                    <div class="input-group">
                        <label>Doctor</label>
                        <input type="text" id="doctor" readonly>
                    </div>

                    <div class="input-group">
                        <label>Disease</label>
                        <input type="text" id="disease" readonly>
                    </div>

                    <div class="input-group">
                        <label>Room Type</label>
                        <input type="text" id="roomType" readonly>
                    </div>

                    <div class="input-group">
                        <label>Admission Date</label>
                        <input type="date" id="admissionDate" readonly>
                    </div>

                </div>

                <div class="buttons">

                    <button type="submit">

                        Save Changes

                    </button>

                </div>

            </form>

        </section>

        <!-- ================= BILLING ================= -->

        <section id="billingSection" style="display:none;">

            <h1>Billing Summary</h1>

            <div class="bill-card">

                <div class="bill-row">

                    <span>Patient Name</span>

                    <strong id="billPatientName"></strong>

                </div>

                <div class="bill-row">

                    <span>Patient ID</span>

                    <strong id="billPatientId"></strong>

                </div>

                <div class="bill-row">

                    <span>Doctor</span>

                    <strong id="billDoctor"></strong>

                </div>

                <div class="bill-row">

                    <span>Disease</span>

                    <strong id="billDisease"></strong>

                </div>

                <div class="bill-row">

                    <span>Room Type</span>

                    <strong id="billRoomType"></strong>

                </div>

                <div class="bill-row">

                    <span>Admission Date</span>

                    <strong id="billAdmissionDate"></strong>

                </div>

                <hr>

                <div class="bill-row">

                    <span>Room Bill</span>

                    <strong id="roomBill"></strong>

                </div>

                <div class="bill-row">

                    <span>Medicine Bill</span>

                    <strong id="medicineBill"></strong>

                </div>

                <div class="bill-row">

                    <span>Diagnostics Bill</span>

                    <strong id="diagnosticsBill"></strong>

                </div>

                <hr>

                <div class="bill-row total">

                    <span>Total Bill</span>

                    <strong id="totalBill"></strong>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="../js/userDashboard.js"></script>

</body>

</html>
