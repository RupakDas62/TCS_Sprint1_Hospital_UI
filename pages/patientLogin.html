<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Patient Login</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <header>

        <div class="logo">

            <i class="fa-solid fa-hospital"></i>

            <div>

                <h1>Hospital Management System</h1>

                <p>Patient Login</p>

            </div>

        </div>

    </header>

    <div class="overlay">

        <div class="login-card">

            <div class="login-icon">

                <i class="fa-solid fa-user"></i>

            </div>

            <h2>Patient Login</h2>

            <p>Login using your Patient ID and Password.</p>

            <form id="patientLoginForm">

                <div class="input-group">

                    <label>Patient ID</label>

                    <input type="text" id="patientUserId" placeholder="Enter Patient ID">

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <input type="password" id="patientPassword" placeholder="Enter Password">

                </div>

                <div class="show-password">

                    <input type="checkbox" id="showPatientPassword">

                    <label>Show Password</label>

                </div>

                <button type="submit">

                    Login

                </button>

                <p id="patientError"></p>

            </form>

            <a href="../index.html" class="back-link">

                ← Back to Portal

            </a>

        </div>

    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/patientAuth.js"></script>

</body>

</html>
